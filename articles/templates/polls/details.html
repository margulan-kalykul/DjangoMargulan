<h1>Title: {{ article.title }}</h1>
<h3>Author: {{ article.author }}</h3>
<span>
    <p>Tags: </p>
    {% for tag in article.tags.all %}
        <p>{{ tag }}</p>
    {% endfor %}
</span>
{% if article.image %}
    <img src="{{ article.image.url }}" alt="{{ article.title }}" style="max-width: 300px;">
{% else %}
    <p>No image available</p>
{% endif %}
<p>{{ article.text }}</p>

<a href="{% url 'update' id=article.id %}" class="btn btn-primary">Update</a>
<br><br><br>
<a href="{% url 'delete_article' id=article.id %}" class="btn btn-primary">Delete</a>
