<!DOCTYPE html>
<html>
<head>
    <title>Image Upload</title>
</head>
<body>
    <ul>
        {% for article in articles %}
            <li>
                <h1>{{ article.title }}</h1>
                <h3>by {{ article.author }}</h3>
                <p>{{ article.text }}</p>
                {% if article.image %}
                    <img src="{{ article.image.url }}" alt="{{ article.title }}" style="max-width: 300px;">
                {% else %}
                    <p>No image available</p>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
